<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n8n Workflow Manipulator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <h1>n8n Workflow</h1>
      <p>Manipulator</p>
    </header>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>

    <div class="section">
      <h3>Quick Actions</h3>
      <button id="read-canvas" class="btn btn-primary">
        📊 Read Canvas State
      </button>
      <button id="open-webapp" class="btn btn-secondary">
        🚀 Open Web App
      </button>
    </div>

    <div class="section">
      <h3>Configuration</h3>
      <div class="form-group">
        <label>n8n URL</label>
        <input type="text" id="n8n-url" placeholder="https://your-n8n.com">
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="api-key" placeholder="Your n8n API key">
      </div>
      <button id="save-config" class="btn btn-primary">💾 Save</button>
    </div>

    <div class="section">
      <h3>Quick Prompt</h3>
      <textarea id="prompt" rows="3" placeholder="Describe workflow changes..."></textarea>
      <button id="execute-prompt" class="btn btn-primary">⚡ Execute</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
